<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 1px solid black;
            width: 80%;
            margin: auto;
            padding:10px

        }
        header{
            border: 1px solid black;
            padding: 20px;
            margin-bottom: 10px;
            justify-items: center;
            background-color: aqua;
        }
        main{
            border: 1px solid black;
            padding: 10px;
            margin-bottom: 10px;
            
            
        }
        button{
            background-color: blue;
            color: white;
            height: 30px;
        }
        button:hover{
            background-color: green;
            color: white;
            transform: scale(1.2);
            cursor: pointer;

        }
        footer{
            background-color:rgb(156, 152, 152) ;
            text-align: center;
            height: auto;
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
        <h2>Welcome to my page</h2>
        <p>This is my official website</p>
        </header>
        <main>
            <h3>About</h3>
            <p>This section is inside the content div</p>
            <button>
                click me
            </button>
        </main>
        <footer>
            &copy;2025 my simple website
        </footer>
    </div>
</body>
</html>
