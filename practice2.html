<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="practice2.css">
    
</head>
<body>
    <div class="container">
        <div class="log"><h2>Login & Sign Up UI/UX</h2></div>
        
        <div class="bodysign">
            <div class="login">
                <div class="profile"></div>
                <div class="login1"><h2>Login</h2></div>
                <div class="table1">
                    <div>
                        <form class="form1">
                            <caption>Email</caption>
                            <input type="email" placeholder="✉️Enter your email">
                        </form>
                    </div>
                    <div>
                        <form>
                            <caption>Password</caption>
                            <input type="password" placeholder="🔒Enter your password">
                        </form>
                    </div>
                </div>
                    <div><button>Log in</button></div>
                    <div class="underlog">
                        <div class="underlog11"></div>
                        <div class="underlog12">or continue with</div>
                        <div class="underlog11"></div>
                    </div>
                    <div class="underlog2">
                        <div class="insidelog"></div>
                        <div class="insidelog"></div>
                    </div>
                    <div class="not">Not registered yet? <a href="signup">Sign up ></a></div>
                
            </div>
            <div class="signup">
                <div class="profile"></div>
                <div class="login1"><h2>Sign Up</h2></div>
                <div class="table1">
                    <div>
                        <form class="form1">
                            <caption>Name</caption>
                            <input type="text" placeholder="Enter your name">
                        </form>
                    </div>
                    <div>
                        <form>
                            <caption>Email</caption>
                            <input type="email" placeholder="Enter your email">
                        </form>
                    </div>
                    <div>
                        <form>
                            <caption>Password</caption>
                            <input type="password" placeholder="🔒Create a password">
                        </form>
                    </div>
                    <div><button>Sign up</button></div>
                    <div class="underlog223">
                        <div class="underlog11"></div>
                        <div class="underlog12">or continue with</div>
                        <div class="underlog11"></div>
                    </div>
                    <div class="underlog3">
                        <div class="insidelog2"></div>
                        <div class="insidelog2"></div>
                    </div>
                    <div class="not">Not registered yet? <a href="signup">Sign up ></a></div>

            </div>
            
        </div>
        

    </div>
    
</body>
</html>
