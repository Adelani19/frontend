<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: pink;
        }
        form{
            border-radius:  20px; /* it is used to curve the border*/
            border: 3px solid black;/* we have different types of border, we have solid, dotting and dash*/
            width: 300px;
            padding:  20px; /* it is used to create space in the box*/
        }
        input{
            height: 30px;
            border-radius: 8px;
        }
        textarea{
            border-radius: 8px;
            padding: 5px;
        }
    </style>
   
</head>
<body>
    <h1>Form in html</h1>
    <p>Form tag is used to define forms in html</p>
    <div>
    <form> 
        <label for="frame">First name</label>
        <input type="text" name="" id="frame"><br><br>
        <label for="la">Last name</label>
        <input type="text" name="" id="la"><br><br>
        <label for="tel">Tel</label>
        <input type="text" name="" id="tel"><br><br>
        <label for="email">email</label>
        <input type="email" name="" id="email"><br><br>
        <label for="password">password</label>
        <input type="password" name="" id="password"><br><br>
        <label for="date">date</label>
        <input type="date" name="" id="date"><br><br>
        <label for="color">color</label>
        <input type="color" name="" id="color">

    <button style="background-color: purple; color: white;">continue</button>
</form>
<hr><br>
<form>
<input type="username" placeholder="Enter your username"><br><br>
<input type="email" placeholder="email"><br><br>
<input type="password" placeholder="password"><br><br>
<textarea name="messages" placeholder="message us" rows="5" 
cols="30"></textarea> 
<input type="submit">
</form>
    
</body>
</html>
