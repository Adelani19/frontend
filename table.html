<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border: 1px solid;
            width: 100%;  
            border-collapse: collapse; 
        }l
        th, td{
            border: 1px solid;
            text-align: center;

        }
        th{ background-color: aquamarine;
            
        }
        td:hover{
            background-color: blue;
            color: white;
        }
        tr:nth-child(2n+1) {
            background-color: green;
            color: white;
        }
        tr:nth-child(2n) {
            background-color: grey;
            color: white;
        }
       
        
    </style>
</head>
<body>
    <h2 style="text-align: center; color: purple;">Tables in html</h2>
    <p>table tag is to define table in html</p>
    <p>tr is used to define table rows</p>
    <p>th is used to define table head</p>
    <p>td is used to define table data</p>
    <table>
        <caption style="text-align: left;">Students Data</caption>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>Fola Wale</td>
            <td>20</td>
            <td>Ibadan</td>
        </tr>
        <tr>
            <td>Fola Yemi</td>
            <td>21</td>
            <td>Ibadan</td>
        </tr>
        <tr>
            <td>Opeyemi</td>
            <td>20</td>
            <td>oyo</td>
        </tr>
        <tr>
            <td>Adelani</td>
            <td>50</td>
            <td>Lagos</td>
        </tr>
    </table>
</body>
</html>
