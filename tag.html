<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            border: 1px solid black;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            margin: auto;
            min-height: 300px;
            width: 300px;
            align-items: center;
        }
        img{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            padding-top: 10px;

        }
        button{
            background-color: green;
            color: white;
            border-radius: 10px;
            height: 40px;
            width: 100px;


        }
        button:hover{
            background-color: blueviolet;
            cursor: pointer;
            color: white;
            transform: scale(1.1)
        }
        p{
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="img.jpg" alt="profile picture">
        <h2>JOHN DOE</h2>
        <P>Web developer who loves html. I am anticipating to be one of them</P>
        <button>Submit</button>
    </div>
</body>
</html>
